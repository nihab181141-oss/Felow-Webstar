<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F47C68" />
    <title>Offline — FeLoW WebStaR</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: linear-gradient(155deg, #FCFBFA 0%, #FFF6F3 52%, #EFEAFF 100%);
        color: #18181B;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 460px;
        background: #FFFFFF;
        border: 1px solid #EFEAE7;
        border-radius: 28px;
        padding: 32px 28px;
        box-shadow: 0 18px 46px rgba(24, 24, 27, 0.08);
        text-align: center;
      }
      .icon-wrap {
        width: 76px;
        height: 76px;
        margin: 0 auto 18px;
        border-radius: 22px;
        background: #FFF6F3;
        border: 1px solid #F5E4DF;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon-wrap img {
        width: 52px;
        height: 52px;
        object-fit: contain;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 700;
        color: #C94A35;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background: #EB624B;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 24px;
        line-height: 1.25;
        font-weight: 800;
        color: #18181B;
      }
      p {
        margin: 0 0 10px;
        font-size: 14px;
        line-height: 1.6;
        color: #52525B;
      }
      .bn {
        font-size: 13px;
        color: #6B6B6B;
        margin-bottom: 22px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }
      button,
      a.btn-secondary {
        height: 44px;
        padding: 0 20px;
        border-radius: 9999px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid transparent;
      }
      .btn-primary {
        background: #EB624B;
        color: #FFFFFF;
      }
      .btn-primary:hover {
        background: #DC533D;
      }
      .btn-secondary {
        background: #F6F4F3;
        border-color: #EAE4E1;
        color: #18181B;
      }
      .btn-secondary:hover {
        background: #EFEAFF;
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <div class="icon-wrap">
        <img src="/pwa-192x192.png" alt="FeLoW WebStaR" />
      </div>
      <div class="status">
        <span class="dot" aria-hidden="true"></span>
        <span>You Are Offline</span>
      </div>
      <h1>No Internet Connection</h1>
      <p>
        FeLoW WebStaR cannot load new tutor profiles or live tuition updates right now. Check your
        Wi-Fi or mobile data and try again.
      </p>
      <p class="bn">
        আপনার ইন্টারনেট সংযোগ বিচ্ছিন্ন রয়েছে। সংযোগ ফিরে এলে স্বয়ংক্রিয়ভাবে রিলোড হবে অথবা নিচের
        বাটনে চাপ দিন।
      </p>
      <div class="actions">
        <button type="button" class="btn-primary" onclick="window.location.reload()">
          Try Reconnecting
        </button>
        <a href="/" class="btn-secondary">Open Cached Home</a>
      </div>
    </main>
    <script>
      window.addEventListener('online', function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
